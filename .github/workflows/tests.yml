name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the tested modules and the tests
      # themselves import nothing outside the standard library.
      - name: Run the state and action table tests
        run: python -m unittest discover -s tests -v
